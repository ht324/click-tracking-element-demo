<html>
  <head>
    <title>IMA HTML5 Simple Demo</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <section>
      <h2> add clickTrackingElement </h2>
      <div id="c1_mainContainer" class="mainContainer">
        <div id="c1_content" class="content">
          <video id="c1_contentElement" class="contentElement">
            <source src="https://storage.googleapis.com/gvabox/media/samples/stock.mp4"></source>
          </video>
        </div>
        <div id="c1_adContainer" class="adContainer"></div>
      </div>
      <button id="c1_playButton" class="button">Play</button>
      <button id="c1_adClickThrough" class="button">AD ClickThrough</button>
    </section>

    <section>
      <h2> none clickTrackingElement </h2>
      <div id="c2_mainContainer" class="mainContainer">
        <div id="c2_content" class="content">
          <video id="c2_contentElement" class="contentElement">
            <source src="https://storage.googleapis.com/gvabox/media/samples/stock.mp4"></source>
          </video>
        </div>
        <div id="c2_adContainer" class="adContainer"></div>
      </div>
      <button id="c2_playButton" class="button">Play</button>
    </section>

    <script src="//imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
    <script src="main.js"></script>
  </body>
</html>
